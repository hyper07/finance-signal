name: publication-checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            research/requirements.txt
            research/requirements-publish.txt

      - name: Install analysis and publication dependencies
        run: python -m pip install -r research/requirements-publish.txt

      - name: Run statistical regression tests
        run: python -m unittest discover -v

      - name: Check Python syntax
        run: python -m compileall -q research model tests

      - name: Check manuscript markup
        working-directory: research
        run: python check_markup.py

      - name: Generate publication LaTeX
        run: python research/papers/build_companions.py arxiv_prefinding frl_submission
